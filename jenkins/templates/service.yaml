apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: {{ .Values.route.namespace }}
  labels:
    app: jenkins
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: agent
      port: 50000
      targetPort: 50000
  selector:
    app: jenkins

